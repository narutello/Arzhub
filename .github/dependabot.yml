version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint@8.x still only supports TypeScript < 6.1
      # Keep TS on 5.x until official support for 6/7 arrives
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
